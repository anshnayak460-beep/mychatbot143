<div class="chat-input">

  <div class="input-wrapper">
    <textarea
      id="userInput"
      placeholder="Ask me anything..."
      rows="1"
    ></textarea>
  </div>

  <button
    class="send-button"
    id="sendButton"
    onclick="sendMessage()"
  >
    <span>Send</span> ➤
  </button>

</div>

<div class="hint">
  Enter to send • Shift + Enter for new line
</div>
