<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 95%;
      max-width: 600px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 22px;
    }

    .chat-header p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 5px;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    .chat-input input:focus {
      border-color: #4f46e5;
    }

    .chat-input button {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 0 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    .chat-input button:hover {
      background: #3730a3;
    }

    @media (max-width: 500px) {
      .chat-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">
      <h1>🤖 My Chatbot</h1>
      <p>Ask me anything</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <div class="bubble">
          Hello! 👋 I'm your chatbot. How can I help you?
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");

    // Send message when Enter is pressed
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(message, sender) {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message;

      messageDiv.appendChild(bubble);
      chatBox.appendChild(messageDiv);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const message = input.value.trim();

      if (message === "") {
        return;
      }

      // Show user's message
      addMessage(message, "user");

      input.value = "";

      // Temporary chatbot response
      setTimeout(function() {
        const reply = getBotReply(message);
        addMessage(reply, "bot");
      }, 500);
    }

    function getBotReply(message) {
      const text = message.toLowerCase();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! 👋 Nice to meet you!";
      }

      if (text.includes("how are you")) {
        return "I'm doing great! 😊 Thanks for asking.";
      }

      if (text.includes("name")) {
        return "I'm My Chatbot 🤖.";
      }

      if (text.includes("github")) {
        return "You can host this chatbot using GitHub Pages!";
      }

      if (text.includes("bye")) {
        return "Goodbye! 👋 Have a great day!";
      }

      return "I received your message: \"" + message +
             "\". You can connect me to an AI API to make me smarter!";
    }
  </script>

</body>
</html>
